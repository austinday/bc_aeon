<!DOCTYPE html>
<html>
<head>
    <title>Event Trust Logger</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #0f0; padding: 20px; }
        #target { 
            width: 200px; height: 200px; 
            background: #444; border: 4px dashed #888; 
            display: flex; align-items: center; justify-content: center; 
            text-align: center; cursor: pointer; user-select: none;
            margin-bottom: 20px;
        }
        #target.held { background: #0f0; color: #000; border-style: solid; }
        #log { 
            background: #000; border: 1px solid #333; 
            padding: 10px; height: 400px; overflow-y: scroll; 
            white-space: pre-wrap; font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Event Trust Logger</h1>
    <div id="target">HOLD ME</div>
    <div id="log"></div>

    <script>
        const target = document.getElementById('target');
        const log = document.getElementById('log');
        let holdTimer;

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toISOString().split('T')[1].slice(0, -1)}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function handleEvent(e) {
            const info = `Event: ${e.type} | Trusted: ${e.isTrusted} | X: ${e.clientX}, Y: ${e.clientY}`;
            addLog(info);

            if (e.type === 'mousedown' || e.type === 'pointerdown') {
                target.classList.add('held');
                target.textContent = 'HELD!';
                holdTimer = setTimeout(() => {
                    addLog('--- HOLD SUCCESSFUL (2s) ---');
                }, 2000);
            }
            if (e.type === 'mouseup' || e.type === 'pointerup') {
                target.classList.remove('held');
                target.textContent = 'HOLD ME';
                clear(holdTimer);
            }
        }

        ['mousedown', 'mouseup', 'mousemove', 'pointerdown', 'pointerup', 'pointermove'].forEach(type => {
            window.addEventListener(type, handleEvent, { passive: true });
        });
    </script>
</body>
</html>
