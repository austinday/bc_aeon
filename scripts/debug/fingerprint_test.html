<!DOCTYPE html>
<html>
<head>
    <title>Event Fingerprint Test</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        #test-btn {
            width: 300px;
            height: 150px;
            font-size: 24px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        #log {
            width: 80%;
            height: 400px;
            background: #222;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            overflow-y: scroll;
            white-space: pre-wrap;
            border: 2px solid #555;
        }
    </style>
</head>
<body>
    <h1>Event Fingerprint Analysis</h1>
    <button id="test-btn">HOLD ME TO TEST</button>
    <div id="log">Event Log:<br></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            const timestamp = new Date().toISOString().split('T')[1].slice(0, -1);
            const entry = `[${timestamp}] ${msg}\n`;
            logDiv.innerText += entry;
            console.log(entry);
        }

        const btn = document.getElementById('test-btn');

        // Track all possible hold-related events
        const events = [
            'mousedown', 'mouseup', 'mousemove', 
            'pointerdown', 'pointerup', 'pointermove'
        ];

        events.forEach(evtName => {
            btn.addEventListener(evtName, (e) => {
                log(`${evtName.toUpperCase()}: trusted=${e.isTrusted}, x=${e.clientX}, y=${e.clientY}, type=${e.type}`);
            });
        });

        // Special check for long-press/context menu
        btn.oncontextmenu = (e) => {
            e.preventDefault();
            log("CONTEXT MENU TRIGGERED");
        };
    </script>
</body>
</html>
