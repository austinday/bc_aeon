<!DOCTYPE html>
<html>
<head>
    <title>Trust Verification</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Event Trust & Sequence Verifier</h2>
    <p>This page logs every mouse/pointer event and its <code>isTrusted</code> property.</p>
    <button id="btn" style="padding: 20px 40px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px;">
        HOLD ME
    </button>
    <div style="margin-top: 20px;">
        <strong>Event Log:</strong>
        <div id="log" style="margin-top: 10px; white-space: pre-wrap; font-family: monospace; border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; background: #f9f9f9;">Log: </div>
    </div>
    <script>
        const logDiv = document.getElementById('log');
        function addLog(msg) {
            const timestamp = new Date().toISOString().split('T')[1].split('Z')[0];
            logDiv.innerText += `[${timestamp}] ${msg}\n`;
            console.log(`[${timestamp}] ${msg}`);
        }

        const target = document.getElementById('btn');
        const events = ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'];
        
        events.forEach(evtName => {
            target.addEventListener(evtName, e => {
                addLog(`${evtName}: trusted=${e.isTrusted}, time=${e.time}, screenX=${e.screenX}, screenY=${e.screenY}`);
            });
        });
    </script>
</body>
</html>
