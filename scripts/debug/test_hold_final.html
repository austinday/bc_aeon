<!DOCTYPE html>
<html>
<head>
    <title>Press and Hold Debugger</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        #hold-btn {
            width: 200px; height: 200px; background: #ff4444; color: white;
            font-size: 24px; border: none; border-radius: 50%; cursor: pointer;
            user-select: none; -webkit-user-select: none;
        }
        #status { margin-top: 20px; font-size: 20px; font-weight: bold; }
        #log { 
            margin-top: 20px; width: 80%; height: 300px; 
            background: #eee; overflow-y: scroll; font-family: monospace; 
            padding: 10px; border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <button id="hold-btn">HOLD ME!</button>
    <div id="status">Status: Not Held</div>
    <div id="log"></div>

    <script>
        const btn = document.getElementById('hold-btn');
        const status = document.getElementById('status');
        const logDiv = document.getElementById('log');
        let holdStart = 0;

        function logEvent(e) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${e.type} | Trusted: ${e.isTrusted} | Target: ${e.target.tagName}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        const events = ['mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart', 'touchend'];
        events.forEach(evt => {
            btn.addEventListener(evt, (e) => {
                logEvent(e);
                if (evt === 'mousedown' || evt === 'pointerdown' || evt === 'touchstart') {
                    holdStart = Date.now();
                } else if (evt === 'mouseup' || evt === 'pointerup' || evt === 'touchend') {
                    const duration = Date.now() - holdStart;
                    if (duration >= 1000) {
                        status.textContent = 'Status: Held! (' + duration + 'ms)';
                        status.style.color = 'green';
                    } else {
                        status.textContent = 'Status: Released too early (' + duration + 'ms)';
                        status.style.color = 'red';
                    }
                }
            });
        });
    </script>
</body>
</html>
