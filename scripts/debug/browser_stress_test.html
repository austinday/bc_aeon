<!DOCTYPE html>
<html>
<head>
    <title>Aeon Browser Stress Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .section { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
    <h1>Aeon Browser Stress Test</h1>

    <div class="section">
        <h2>1. Standard Elements</h2>
        <button id="std-btn">Standard Button</button>
        <input type="text" id="std-input" placeholder="Standard Input">
    </div>

    <div class="section">
        <h2>2. iFrame Element</h2>
        <p>The button below is inside an iframe.</p>
        <iframe id="test-iframe" srcdoc="<html><body><button id='iframe-btn'>Iframe Button</button></body></html>" width="300" height="100"></iframe>
    </div>

    <div class="section">
        <h2>3. Shadow DOM Element</h2>
        <p>The button below is inside a Shadow Root.</p>
        <div id="shadow-host"></div>
        <script>
            const host = document.getElementById('shadow-host');
            const root = host.attachShadow({mode: 'open'});
            root.innerHTML = `<button id="shadow-btn">Shadow Button</button>`;
        </script>
    </div>

    <div class="section">
        <h2>4. File Upload</h2>
        <p>Try to upload a file here.</p>
        <input type="file" id="file-upload">
    </div>

    <div class="section">
        <h2>5. Complex Interaction</h2>
        <p>Drag the box to the target.</p>
        <div id="drag-source" draggable="true" style="width:50px; height:50px; background:red; cursor:move;">Drag Me</div>
        <div id="drag-target" style="width:100px; height:100px; border:2px dashed black; margin-top:10px;">Target</div>
    </div>
</body>
</html>
