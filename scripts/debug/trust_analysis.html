<!DOCTYPE html>
<html>
<head>
    <title>Trust Analysis</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        #log { 
            margin-top: 20px; 
            padding: 10px; 
            background: white; 
            border: 1px solid #ccc; 
            white-space: pre-wrap; 
            font-family: monospace; 
            height: 400px; 
            overflow-y: auto; 
        }
        button { padding: 20px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Trust Analysis Page</h2>
    <p>This page logs the <code>isTrusted</code> property and timing of mouse/pointer events.</p>
    <button id="testBtn">Hold Me!</button>
    <div id="log">Log: </div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) { 
            logDiv.innerText += msg + '\n'; 
            console.log(msg); 
        }

        const btn = document.getElementById('testBtn');
        
        btn.addEventListener('mousedown', (e) => {
            log(`Mousedown: trusted=${e.isTrusted}, time=${Date.now()}, type=${e.type}`);
        });
        btn.addEventListener('mouseup', (e) => {
            log(`Mouseup: trusted=${e.isTrusted}, time=${Date.now()}, type=${e.type}`);
        });
        btn.addEventListener('pointerdown', (e) => {
            log(`PointerDown: trusted=${e.isTrusted}, time=${Date.now()}`);
        });
        btn.addEventListener('pointerup', (e) => {
            log(`PointerUp: trusted=${e.isTrusted}, time=${Date.now()}`);
        });
        btn.addEventListener('pointercancel', (e) => {
            log(`PointerCancel: trusted=${e.isTrusted}`);
        });
    </script>
</body>
</html>
