<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0;">
    <div id="log" style="white-space:pre; font-family:monospace; background:#eee; padding:20px; border:1px solid #ccc; width:80%; height:300px; overflow-y:auto; margin-bottom:20px;">Log: Waiting for interaction...</div>
    <button id="target" style="padding:20px 40px; font-size:24px; cursor:pointer; background:#007bff; color:white; border:none; border-radius:8px;">
        Press and Hold Me
    </button>
    <script>
        const logDiv = document.getElementById('log');
        function addLog(msg) {
            logDiv.innerText += '\\n' + msg;
            console.log(msg);
        }
        const btn = document.getElementById('target');
        btn.addEventListener('mousedown', e => {
            addLog(`Mousedown: trusted=${e.isTrusted}, time=${Date.now()}, x=${e.clientX}, y=${e.clientY}`);
        });
        btn.addEventListener('mouseup', e => {
            addLog(`Mouseup: trusted=${e.isTrusted}, time=${Date.now()}, x=${e.clientX}, y=${e.clientY}`);
        });
        btn.addEventListener('pointerdown', e => {
            addLog(`PointerDown: trusted=${e.isTrusted}`);
        });
        btn.addEventListener('pointerup', e => {
            addLog(`PointerUp: trusted=${e.isTrusted}`);
        });
    </script>
</body>
</html>
