<!DOCTYPE html>
<html>
<head>
    <style>
        button { width: 200px; height: 100px; font-size: 20px; }
        #status { font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <button id="testBtn">Hold Me!</button>
    <div id="status">Status: Not Held</div>
    <script>
        const btn = document.getElementById('testBtn');
        const stat = document.getElementById('status');
        let start = 0;
        
        btn.addEventListener('mousedown', () => {
            start = Date.now();
            console.log('Mousedown triggered at ' + start);
        });
        
        btn.addEventListener('mouseup', () => {
            let dur = Date.now() - start;
            console.log('Mouseup triggered at ' + Date.now() + ' duration: ' + dur + 'ms');
            if (dur >= 1000) {
                stat.innerText = 'Status: Held! (' + dur + 'ms)';
            }
        });
    </script>
</body>
</html>
