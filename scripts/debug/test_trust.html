<!DOCTYPE html>
<html>
<head>
    <title>Trust Test</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #hold-btn { width: 200px; height: 100px; background: #007bff; color: white; border: none; border-radius: 10px; font-size: 20px; cursor: pointer; }
        #status { margin-top: 20px; font-size: 24px; font-weight: bold; }
        #log { margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #eee; padding: 10px; width: 80%; }
    </style>
</head>
<body>
    <button id="hold-btn">HOLD ME</button>
    <div id="status">Status: Not Held</div>
    <div id="log">Event Log:</div>

    <script>
        const btn = document.getElementById('hold-btn');
        const status = document.getElementById('status');
        const log = document.getElementById('log');
        let holdStart = 0;

        function addLog(msg) {
            log.innerText += '\n' + msg;
            console.log(msg);
        }

        btn.addEventListener('mousedown', (e) => {
            holdStart = Date.now();
            addLog(`mousedown: trusted=${e.isTrusted}`);
        });

        btn.addEventListener('mouseup', (e) => {
            const duration = Date.now() - holdStart;
            addLog(`mouseup: trusted=${e.isTrusted}, duration=${duration}ms`);
            if (duration >= 1000) {
                status.innerText = 'Status: Held!';
                status.style.color = 'green';
            }
        });

        btn.addEventListener('pointerdown', (e) => {
            addLog(`pointerdown: trusted=${e.isTrusted}`);
        });
    </script>
</body>
</html>
